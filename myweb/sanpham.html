<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>PC Store - Sản Phẩm</title>
    <style>
        /* CSS đồng bộ khung ảnh giúp ảnh khít 100% và đẹp */
        .product-img {
            width: 100%;
            height: 250px; 
            overflow: hidden;
            border-radius: 12px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Giúp ảnh lấp đầy khung mà không bị méo */
            transition: transform 0.4s ease;
        }
        .product-card:hover .product-img img {
            transform: scale(1.08);
        }
        .product-grid {
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px;
            margin-top: 20px;
        }
    </style>
</head>
