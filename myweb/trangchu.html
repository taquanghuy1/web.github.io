    <style>
        /* CSS giúp ảnh trang chủ sắc nét, khít khung và có hiệu ứng Gaming */
        .hero-img-container {
            flex: 1;
            height: 450px; /* Tăng thêm một chút độ cao cho ảnh 4K */
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #ff4d4d;
            box-shadow: 0 0 30px rgba(255, 77, 77, 0.5); /* Hiệu ứng phát sáng đỏ mạnh hơn */
            background: #000;
        }
        .hero-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Giúp ảnh 4K khít 100% không bị méo */
            display: block;
            transition: transform 0.6s ease;
        }
        .hero-img-container:hover img {
            transform: scale(1.05); /* Hiệu ứng zoom nhẹ khi di chuột */
        }
    </style>
</head>
